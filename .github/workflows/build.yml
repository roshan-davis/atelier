name: Build and test

on:
  # PR branches build through pull_request only, so each push costs one macOS run, not two.
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Build
        run: swift build
      - uses: actions/cache@v4
        with:
          path: samples
          key: sample-raws-v1
      - name: Sample RAW files
        # Real Nikon Z files from raw.pixls.us (CC0) for the camera match test; skipped if unreachable.
        continue-on-error: true
        run: |
          mkdir -p samples
          for model in "Z 6" "Z f"; do
            name="Nikon-${model// /}.NEF"
            [ -s "samples/$name" ] && continue
            base="https://raw.pixls.us/data/Nikon/${model// /%20}/"
            page=$(curl -fsSL "$base") || { echo "no listing for $model"; continue; }
            file=$(echo "$page" | grep -oiE 'href="[^"?/]+\.nef"' | head -1 | sed -E 's/^href="//; s/"$//')
            if [ -z "$file" ]; then echo "$page" | head -40; continue; fi
            curl -fsSL -o "samples/$name" "$base$file" || rm -f "samples/$name"
          done
          ls -l samples
      - name: Test
        run: |
          set -o pipefail
          export ATELIER_SAMPLE_RAWS="$PWD/samples" ATELIER_SAMPLE_OUT="$PWD/snapshots"
          swift test 2>&1 | tee test.log
          grep "CAMERA MATCH" test.log || true
      - name: Native UI smoke and visual comparison
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$PR_BASE"
          python3 Scripts/check_ui.py --base "$PR_BASE" --output "$PWD/ui-results"
      - name: Publish UI check summary
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -f ui-results/summary.txt ]; then
            {
              echo '### Atelier UI checks'
              echo '```'
              cat ui-results/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-snapshots
          path: |
            ui-results
            snapshots
