name: Build and test

on:
  # PR branches build through pull_request only, so each push costs one macOS run, not two.
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Layout snapshots
        run: |
          export ATELIER_SNAPSHOTS="$PWD/snapshots"
          perl -e 'alarm 120; exec @ARGV' .build/debug/AtelierApp
          ls -l snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-snapshots
          path: snapshots
